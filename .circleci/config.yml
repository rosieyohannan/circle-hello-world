version: 2.1

jobs:
  noop:
    docker:
      - image: cimg/base:current
    steps:
      - run: echo "ran"

workflows:
  branch-is-empty-string:
    when: pipeline.git.branch == ""
    jobs:
      - noop:
          filters: 1 == 1
  tag-is-empty-string:
    when: pipeline.git.tag == ""
    jobs:
      - noop:
          filters: 1 == 1
  tag-or-fallback:
    when: (pipeline.git.tag or "none") == "none"
    jobs:
      - noop:
          filters: 1 == 1
  branch-or-fallback:
    when: (pipeline.git.branch or "none") == "none"
    jobs:
      - noop:
          filters: 1 == 1
  always:
    when: true
    jobs:
      - noop:
          filters: 1 == 1

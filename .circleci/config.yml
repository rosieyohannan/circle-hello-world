version: 2.1

jobs:
  ctx-check:
    docker:
      - image: cimg/base:current
    steps:
      - run:
          name: Context available
          command: |
            echo "context test loaded"
            echo "branch=$CIRCLE_BRANCH"
            test -n "$test" && echo "env var from context is set"

workflows:
  w:
    jobs:
      - ctx-check:
          context: test
